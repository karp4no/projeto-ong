<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se para participar como voluntário da ONG Esperança.">
    <title>ONG Esperança | Cadastro de Voluntário</title>
</head>

<body>

    <header>
        <img src="img/logo.png" alt="Logo da ONG Esperança">

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Seja um voluntário</a>
        </nav>
    </header>

    <main>

        <section>
            <h1>Seja um voluntário</h1>

            <p>
                Preencha o formulário abaixo para demonstrar seu interesse
                em participar das ações da ONG Esperança.
            </p>
        </section>

        <form action="#" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo:</label><br>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required
                        minlength="3"
                        placeholder="Digite seu nome completo">
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        placeholder="exemplo@email.com">
                </p>

                <p>
                    <label for="nascimento">Data de nascimento:</label><br>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required>
                </p>

                <p>
                    <label for="cpf">CPF:</label><br>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="14"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        title="Digite o CPF no formato 000.000.000-00"
                        placeholder="000.000.000-00"
                        required>
                </p>

                <p>
                    <label for="telefone">Telefone:</label><br>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        inputmode="tel"
                        autocomplete="tel"
                        maxlength="15"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                        title="Digite o telefone no formato (00) 00000-0000"
                        placeholder="(11) 99999-9999"
                        required>
                </p>

            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <p>
                    <label for="cep">CEP:</label><br>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        maxlength="9"
                        pattern="[0-9]{5}-[0-9]{3}"
                        title="Digite o CEP no formato 00000-000"
                        placeholder="00000-000"
                        required>
                </p>

                <p>
                    <label for="endereco">Endereço:</label><br>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        autocomplete="street-address"
                        required
                        placeholder="Digite seu endereço">
                </p>

                <p>
                    <label for="cidade">Cidade:</label><br>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        autocomplete="address-level2"
                        required
                        placeholder="Digite sua cidade">
                </p>

                <p>
                    <label for="estado">Estado:</label><br>
                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        maxlength="2"
                        autocomplete="address-level1"
                        pattern="[A-Za-z]{2}"
                        title="Digite a sigla do estado, por exemplo SP"
                        placeholder="SP"
                        required>
                </p>

            </fieldset>

            <fieldset>
                <legend>Interesse em voluntariado</legend>

                <p>
                    <label for="area">Área de interesse:</label><br>

                    <select id="area" name="area" required>
                        <option value="">Selecione uma opção</option>
                        <option value="educacao">Educação</option>
                        <option value="meio-ambiente">Meio ambiente</option>
                        <option value="assistencia">Assistência social</option>
                        <option value="outros">Outras atividades</option>
                    </select>
                </p>

                <p>
                    <label for="mensagem">Conte um pouco sobre como deseja ajudar:</label><br>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        minlength="10"
                        required
                        placeholder="Escreva sua mensagem"></textarea>
                </p>

            </fieldset>

            <p>
                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar formulário</button>
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>

    <script>
        const cpf = document.getElementById("cpf");
        const telefone = document.getElementById("telefone");
        const cep = document.getElementById("cep");

        cpf.addEventListener("input", function () {
            let valor = cpf.value.replace(/\D/g, "");

            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
            valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            cpf.value = valor;
        });

        telefone.addEventListener("input", function () {
            let valor = telefone.value.replace(/\D/g, "");

            valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
            valor = valor.replace(/(\d{5})(\d{4})$/, "$1-$2");

            telefone.value = valor;
        });

        cep.addEventListener("input", function () {
            let valor = cep.value.replace(/\D/g, "");

            valor = valor.replace(/^(\d{5})(\d)/, "$1-$2");

            cep.value = valor;
        });
    </script>

</body>
</html>
